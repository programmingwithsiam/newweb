<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Chat | CodeWithSiam</title>
  <meta name="description" content="Private text conversations for CodeWithSiam community members.">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/images/profile-siam-round.png?v=20260828">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/community.css">
  <link rel="stylesheet" href="assets/css/community-overrides.css">
  <link rel="stylesheet" href="assets/css/personal-chat.css">
  <style>body.personal-chat-page{background:#081116;color:#e9edef}.personal-chat-page .community-topbar{height:68px;background:rgba(16,29,35,.88);border-bottom:1px solid rgba(143,181,176,.16);box-shadow:0 8px 30px rgba(0,0,0,.18);backdrop-filter:blur(18px)}.personal-chat-layout{width:100%;max-width:none;margin:0;grid-template-columns:minmax(290px,370px) minmax(0,1fr);height:calc(100vh - 68px);background:#0d181e}.chat-contacts{background:linear-gradient(180deg,#132129 0%,#0d181e 100%);border-right:1px solid rgba(143,181,176,.14)}.chat-contacts-head{padding:22px 20px;background:rgba(24,43,51,.72);border-bottom:1px solid rgba(143,181,176,.12)}.chat-contacts-head h1{font-size:1.35rem;letter-spacing:.01em}.chat-window{background:#081116}.chat-window-empty.hidden{display:none!important}.chat-window-head{flex:0 0 auto;min-height:78px;padding:15px 24px;background:rgba(24,43,51,.84);border-bottom:1px solid rgba(143,181,176,.16);box-shadow:0 5px 20px rgba(0,0,0,.14);backdrop-filter:blur(16px)}.chat-active{height:100%}.chat-active .message-list{min-height:0;padding:24px clamp(18px,4vw,64px);background-color:#081116;background-image:radial-gradient(circle at 15% 20%,rgba(103,205,170,.07) 0 1px,transparent 2px),radial-gradient(circle at 78% 68%,rgba(117,160,255,.05) 0 1px,transparent 2px);background-size:38px 38px,52px 52px}.chat-active .message-form{flex:0 0 auto;margin:0 clamp(16px,4vw,64px) 20px;padding:9px 11px;border:1px solid rgba(143,181,176,.18);border-radius:26px;background:rgba(24,43,51,.9);box-shadow:0 10px 28px rgba(0,0,0,.2)}.chat-active .message-form input{border:0;background:transparent}.message-list .private-message{align-self:flex-start;max-width:min(70%,560px);padding:11px 15px;border:1px solid rgba(143,181,176,.1);border-radius:6px 17px 17px 17px;color:#e9edef;background:#1b2a31;box-shadow:0 5px 14px rgba(0,0,0,.12);line-height:1.5}.message-list .private-message.mine{align-self:flex-end;border-color:rgba(103,205,170,.18);border-radius:17px 6px 17px 17px;color:#effff8;background:linear-gradient(135deg,#087e68,#056451);box-shadow:0 5px 16px rgba(0,92,75,.25)}.chat-window-head h2{color:#f2f7f7;font-size:1rem}.chat-window-head small{color:#93a9b1}.chat-contact{margin:3px 8px;width:calc(100% - 16px);padding:13px 12px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}.chat-contact:hover{background:rgba(44,70,78,.6);border-color:rgba(143,181,176,.12);transform:translateX(2px)}.chat-contact.active{background:linear-gradient(90deg,rgba(62,103,105,.62),rgba(34,61,69,.78));border-color:rgba(120,211,177,.2);box-shadow:inset 3px 0 #67cdaa}.chat-contacts-head h1,.personal-chat-title{color:#f2f7f7}.message-ticks.seen{color:#6ed7ff}.chat-header-action{width:34px;height:34px;border-radius:50%;background:rgba(143,181,176,.08)}.chat-header-action:hover{background:rgba(103,205,170,.15)}@media(max-width:700px){.personal-chat-layout{display:block;height:calc(100vh - 68px)}.chat-window{left:0;right:0;top:68px}.chat-active .message-form{margin-bottom:10px}.message-list .private-message{max-width:84%}}</style>
  <style>
    .personal-chat-layout { min-height: 0; overflow: hidden; }
    .chat-active .message-list { min-width: 0; overflow-x: hidden; overscroll-behavior: contain; }
    .private-message { position: relative; overflow-wrap: anywhere; }
    .private-message p { margin: 0; }
    .private-message-actions { display: flex; align-items: center; gap: 10px; margin-top: 7px; opacity: .78; }
    .private-message-actions button { padding: 0; border: 0; color: inherit; background: transparent; font: inherit; font-size: .68rem; cursor: pointer; }
    .private-message-actions button:hover { color: #67cdaa; }
    .message-reply-label { display: block; margin-bottom: 5px; color: #93a9b1; font-size: .65rem; }
    .message-edited { color: inherit; opacity: .6; font-size: .62rem; }
    @media (max-width: 700px) { .personal-chat-layout { height: calc(100dvh - 68px); } .chat-window { overflow: hidden; } .chat-active .message-list { padding: 18px 12px; } .message-list .private-message { max-width: 88%; } }
  </style>
</head>
<body class="personal-chat-page">
  <header class="community-topbar"><a href="community.html" class="brand"><i class="fa-solid fa-arrow-left"></i> Community</a><strong class="personal-chat-title">Personal Chat</strong><span></span></header>
  <main class="personal-chat-layout">
    <aside class="chat-contacts"><div class="chat-contacts-head"><h1>Chats</h1><span id="chatUserState">Sign in</span></div><div id="chatContactsList" class="chat-contacts-list"><p class="comments-empty">Sign in to view your chats.</p></div></aside>
    <section class="chat-window"><div id="chatEmpty" class="chat-window-empty"><i class="fa-regular fa-message"></i><h2>Select a conversation</h2><p>Choose a person from your chats to start messaging.</p></div><div id="chatActive" class="chat-active hidden"><div class="chat-window-head"><span id="chatTargetAvatar" class="message-avatar"></span><div><h2 id="chatTargetName">Personal Chat</h2><small id="chatTargetPresence">Offline</small></div><span class="chat-header-actions"><button type="button" aria-label="Start video call" title="Video call"><i class="fa-solid fa-video"></i></button><button type="button" aria-label="Start voice call" title="Voice call"><i class="fa-solid fa-phone"></i></button><button type="button" aria-label="Search messages" title="Search messages"><i class="fa-solid fa-magnifying-glass"></i></button><button id="editChatNickname" type="button" aria-label="Change nickname" title="Change nickname"><i class="fa-solid fa-pen"></i></button><button type="button" aria-label="More chat options" title="More options"><i class="fa-solid fa-ellipsis-vertical"></i></button></span></div><div id="chatMessages" class="message-list"></div><form id="chatForm" class="message-form"><button type="button" class="message-attach" aria-label="Attach file" title="Attach file"><i class="fa-solid fa-paperclip"></i></button><button type="button" class="message-emoji" aria-label="Add emoji" title="Add emoji"><i class="fa-regular fa-face-smile"></i></button><input id="chatText" maxlength="1000" placeholder="Type a message" aria-label="Write a private message" required><button type="button" class="message-mic" aria-label="Record voice message" title="Voice message"><i class="fa-solid fa-microphone"></i></button><button type="submit" aria-label="Send message" title="Send message"><i class="fa-solid fa-paper-plane"></i></button></form><p id="chatStatus" class="message-status"></p></div></section>
  </main>
  <script type="module" src="assets/js/personal-chat.js?v=20260828-chat-fix-3"></script>
  <script type="module" src="assets/js/social-enhancements.js?v=20260830-social-1"></script>
</body>
</html>
