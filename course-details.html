<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Details | CodeWithSiam</title>
  <meta name="description" content="Explore a CodeWithSiam course.">
  <link rel="icon" type="image/png" href="assets/images/tab.png">
  <style>
    :root{--bg:#05070b;--surface:#10141c;--surface-2:#151b26;--ink:#f5f7fb;--muted:#8c96aa;--line:#283044;--accent:#9347ff;--accent-2:#ffd43b;--shadow:0 24px 70px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 14%,rgba(147,71,255,.13),transparent 30%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.details-nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5vw);border-bottom:1px solid var(--line);background:rgba(8,11,17,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.brand{color:var(--ink);font-weight:850;letter-spacing:-.02em;text-decoration:none}.brand-mark{color:var(--accent-2);margin-right:8px}.nav-link{padding:9px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;text-decoration:none;transition:color .2s,background .2s}.nav-link:hover{color:var(--accent-2);background:rgba(147,71,255,.12)}.details-page{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:64px 0 90px}.details-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:64px;align-items:center}.eyebrow{margin:0 0 14px;color:var(--accent-2);font-size:.72rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.details-hero h1{max-width:680px;margin:0;font-size:clamp(2.8rem,5vw,5rem);line-height:.98;letter-spacing:-.055em;overflow-wrap:anywhere}.details-hero p{max-width:620px;margin:20px 0 0;color:var(--muted);font-size:1rem;line-height:1.75}.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;color:var(--muted);font-size:.82rem}.hero-meta span{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035)}.hero-media{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#111722,#1a2030);box-shadow:var(--shadow);transform:translateY(-4px)}.hero-media img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.hero-media-fallback{display:grid;place-items:center;aspect-ratio:16/10;color:var(--accent-2);font-size:3.2rem;font-weight:900}.price{display:block;margin:26px 0 20px;color:var(--accent-2);font-size:2rem;font-weight:850;letter-spacing:-.03em}.actions{display:flex;flex-wrap:wrap;gap:10px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--surface-2);font-weight:750;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}.button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.24)}.button.primary{border-color:var(--accent);color:#fff;background:linear-gradient(135deg,#9347ff,#7132c9)}.details-section{margin-top:78px}.details-section h2{margin:0 0 18px;font-size:1.55rem;letter-spacing:-.025em}.details-section>p{max-width:760px;margin:0 0 22px;color:var(--muted);line-height:1.8}.content-list{display:grid;gap:10px;max-width:920px}.module{border:1px solid var(--line);border-radius:10px;background:rgba(16,20,28,.84);overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.14)}.module summary{padding:17px 18px;font-weight:750;cursor:pointer}.lesson{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}.lesson a{color:var(--accent-2);font-weight:750;text-decoration:none}.state{display:grid;place-items:center;min-height:45vh;text-align:center;color:var(--muted)}.state strong{display:block;margin-bottom:8px;color:var(--ink);font-size:1.4rem}.skeleton{height:14px;width:70%;margin:10px 0;border-radius:5px;background:linear-gradient(90deg,#1b2230,#2a3345,#1b2230);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:760px){.details-page{padding-top:34px}.details-hero{grid-template-columns:1fr;gap:30px}.hero-media{order:-1;transform:none}.details-section{margin-top:50px}.details-nav{height:64px}}
    /* Responsive course details polish */
    html { overflow-x: hidden; }
    body { overflow-x: hidden; }
    .details-page { width: min(1120px, calc(100% - 48px)); }
    .details-hero { min-width: 0; }
    .details-hero > div { min-width: 0; }
    .details-hero h1 { overflow-wrap: anywhere; }
    .hero-media { min-width: 0; }
    .hero-meta span { white-space: nowrap; }
    .details-section { max-width: 920px; }
    .module summary { display: flex; justify-content: space-between; gap: 14px; }
    .module summary span { color: var(--muted); font-size: .8rem; font-weight: 500; white-space: nowrap; }
    @media (max-width: 980px) {
      .details-hero { grid-template-columns: 1fr; gap: 28px; }
      .hero-media { order: -1; max-width: 720px; }
      .details-hero h1 { font-size: clamp(2rem, 7vw, 3.4rem); }
    }
    @media (max-width: 560px) {
      .details-page { width: min(100% - 28px, 520px); padding-top: 28px; }
      .details-nav { padding: 0 14px; }
      .details-hero p { font-size: .9rem; }
      .hero-meta { gap: 6px; }
      .hero-meta span { padding: 7px 8px; font-size: .74rem; }
      .price { margin: 18px 0; font-size: 1.7rem; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .button { width: 100%; }
      .details-section { margin-top: 44px; }
      .details-section h2 { font-size: 1.3rem; }
      .lesson { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <nav class="details-nav"><a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span>CodeWithSiam</a><a class="nav-link" href="index.html#course">All Courses</a></nav>
  <main class="details-page" id="courseDetailsApp"><section class="state"><div><div class="skeleton"></div><div class="skeleton"></div><p>Loading course details...</p></div></section></main>
  <script type="module">
    let fetchAllCourses;
    let observeAuthState;
    const app = document.getElementById('courseDetailsApp');
    const courseId = new URLSearchParams(location.search).get('course');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(course, user) {
      if (!course) { app.innerHTML = '<section class="state"><div><strong>Course not found</strong><p>Choose a course from the CodeWithSiam course library.</p><a class="button primary" href="index.html#course">Browse Courses</a></div></section>'; return; }
      const access = user && !course.accessDenied;
      const price = Number(course.discountPrice) > 0 && Number(course.discountPrice) < Number(course.price) ? Number(course.discountPrice) : Number(course.price);
      const modules = (course.modules || []).map((module, index) => `<details class="module" ${index === 0 ? 'open' : ''}><summary>Module ${String(index + 1).padStart(2, '0')} · ${escapeHtml(module.title)} <span>${(module.lessons || []).length} lessons</span></summary>${(module.lessons || []).map((lesson, lessonIndex) => `<div class="lesson"><span>${String(lessonIndex + 1).padStart(2, '0')} · ${escapeHtml(lesson.title)} <small>${escapeHtml(lesson.duration || '')}</small></span>${lesson.videoUrl && lesson.videoType !== 'file' ? `<a href="course.html?course=${encodeURIComponent(course.id)}&lesson=${encodeURIComponent(lesson.id)}">Preview</a>` : '<span>Locked</span>'}</div>`).join('')}</details>`).join('');
      document.title = `${course.title} | CodeWithSiam`;
      const about = course.description ? `<section class="details-section"><h2>About This Course</h2><p>${escapeHtml(course.description)}</p></section>` : '';
      const content = (course.modules || []).length || access ? `<section class="details-section"><h2>Course Content</h2><p>${(course.modules || []).length} Modules · ${course.lessons?.length || 0} Lessons</p><div class="content-list">${access && modules ? modules : '<div class="module"><div class="lesson"><span>Sign in and enroll to view the course curriculum.</span></div></div>'}</div></section>` : '';
      app.innerHTML = `<section class="details-hero"><div><p class="eyebrow">${escapeHtml(course.category || 'Online Course')}</p><h1>${escapeHtml(course.title)}</h1>${course.description ? `<p>${escapeHtml(course.description)}</p>` : ''}<div class="hero-meta"><span>${escapeHtml(course.instructor || 'CodeWithSiam')}</span><span>${(course.modules || []).length} modules</span><span>${course.lessons?.length || 0} lessons</span></div><strong class="price">${price > 0 ? `৳${price.toLocaleString('en-BD')}` : 'Free'}</strong><div class="actions"><a class="button primary" href="course.html?course=${encodeURIComponent(course.id)}&enroll=1">${access ? 'Start Learning' : 'Enroll & Pay'}</a><a class="button" href="index.html#course">Back to Courses</a></div></div><div class="hero-media">${course.thumbnail ? `<img src="${escapeHtml(course.thumbnail)}" alt="${escapeHtml(course.title)} thumbnail">` : '<div class="hero-media-fallback">&lt;/&gt;</div>'}</div></section>${about}${content}`;
    }
    async function load(user) {
      if (!courseId) return render(null, user);
      const timeout = new Promise(resolve => setTimeout(() => resolve(null), 8000));
      const courses = await Promise.race([fetchAllCourses(), timeout]).catch(() => null);
      if (!courses) {
        app.innerHTML = '<section class="state"><div><strong>Course data unavailable</strong><p>Check your internet connection, then try again.</p><button class="button primary" type="button" onclick="location.reload()">Retry</button></div></section>';
        return;
      }
      render(courses.find(course => course.id === courseId), user);
    }
    function showLoadError() {
      app.innerHTML = '<section class="state"><div><strong>Course data unavailable</strong><p>Check your internet connection, then try again.</p><button class="button primary" type="button" onclick="location.reload()">Retry</button></div></section>';
    }
    async function init() {
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase modules timed out.')), 8000));
      try {
        const [{ fetchAllCourses: fetchCourses }, { observeAuthState: watchAuth }] = await Promise.race([
          Promise.all([import('./assets/js/courses-db.js?v=20260824-course-data-v2'), import('./assets/js/auth.js?v=20260824-auth-v2')]),
          timeout
        ]);
        fetchAllCourses = fetchCourses;
        observeAuthState = watchAuth;
        load(null);
        observeAuthState(user => load(user));
      } catch (error) {
        console.error('Course details initialization failed:', error);
        showLoadError();
      }
    }
    init();
  </script>
</body>
</html>
