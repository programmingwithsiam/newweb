<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeWithSiam Community</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#18191a;--surface:#242526;--s2:#3a3b3c;--line:#3e4042;--text:#e4e6eb;--muted:#b0b3b8;--accent:#2d88ff;--ink:#fff;--btn:#2374e1;--hov:#4e4f50;--yt:#ff3b3b;--fb:#1877f2;--ig:#e1306c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f0f2f5;--surface:#fff;--s2:#f0f2f5;--line:#ced0d4;--text:#050505;--muted:#65676b;--accent:#1877f2;--ink:#fff;--btn:#1877f2;--hov:#e4e6eb}}
:root[data-theme="light"]{--bg:#f0f2f5;--surface:#fff;--s2:#f0f2f5;--line:#ced0d4;--text:#050505;--muted:#65676b;--accent:#1877f2;--ink:#fff;--btn:#1877f2;--hov:#e4e6eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0}
nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px}
nav .brand{font:800 18px 'Bricolage Grotesque',sans-serif}nav .brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;margin:0 auto}
.tabs button{background:none;border:0;padding:8px 22px;border-radius:10px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--s2)}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.g{background:var(--s2);color:var(--text)}
.layout{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr;padding:10px}aside{display:none}.tabs button{padding:8px 12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
main{max-width:620px;width:100%;margin:0 auto}
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.st{flex:0 0 104px;height:178px;border-radius:14px;position:relative;overflow:hidden;border:0;padding:0;background:var(--s2);color:#fff;text-align:left}
.st .bg{position:absolute;inset:0;background-size:cover;background-position:center;display:grid;place-items:center;padding:8px;font:700 13px 'Bricolage Grotesque',sans-serif;text-align:center}
.st .ring{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#38bdf8,#a78bfa,#f472b6)}
.st .ring.seen{background:var(--line)}
.st .ring .av{width:100%;height:100%;border:2px solid var(--surface)}
.st .nm{position:absolute;left:8px;right:8px;bottom:8px;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000a}
.st.add .bg{background:var(--s2);color:var(--text);align-content:end;padding-bottom:34px}
.st.add .plus{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:24px;font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px sans-serif;color:#04202e;flex:none}
.comp{padding:14px;margin-bottom:14px}
.comp .r{display:flex;gap:10px}
.comp textarea{flex:1;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:10px 16px;resize:none;height:44px}
.comp .acts{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.comp .acts button{flex:1;background:none;border:0;padding:8px;border-radius:8px;color:var(--muted);font-weight:600;min-width:110px}
.comp .acts button:hover{background:var(--s2);color:var(--text)}
.prev{margin-top:10px;display:none}.prev.on{display:block}
.prev img{max-width:100%;max-height:220px;border-radius:10px}
.linkrow{display:none;margin-top:10px;gap:8px}.linkrow.on{display:flex}
input.in{flex:1;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.post{margin-bottom:14px}
.ph{display:flex;gap:10px;padding:12px 14px 6px;align-items:center}
.ph b{display:block;line-height:1.2}.ph small{color:var(--muted)}
.pt{padding:4px 14px 10px;white-space:pre-wrap}
.post img.m{width:100%;display:block;max-height:560px;object-fit:cover}
.vid{position:relative;display:grid;place-items:center;aspect-ratio:16/9;color:#fff;text-decoration:none;overflow:hidden}
.vid.yt{background:linear-gradient(135deg,#7a0f1e,#ff3b3b)}.vid.fb{background:linear-gradient(135deg,#0b3a8f,#1877f2)}.vid.ig{background:linear-gradient(135deg,#5a2ca0,#e1306c,#f7a14b)}
.vid.fb-reel{width:min(100%,360px);aspect-ratio:9/16;margin-inline:auto;background:#000}
.vid .pl{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:26px;padding-left:5px}
.vid .bd{position:absolute;top:10px;left:10px;background:#0009;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.vid .op{position:absolute;bottom:10px;right:10px;background:#0009;padding:4px 10px;border-radius:8px;font-size:12px}
.vid.community-video-player{display:block;width:100%;aspect-ratio:44/35;background:#000;cursor:default}
.community-video-surface{position:absolute;inset:0;background:#000}
.community-video-surface>div:first-child,.community-video-surface iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.community-video-center{position:absolute;top:50%;left:50%;z-index:4;display:grid;width:64px;height:64px;place-items:center;transform:translate(-50%,-50%);border:1px solid #ffffff4d;border-radius:50%;background:#0009;color:#fff;cursor:pointer}
.community-video-center[hidden]{display:none}
.community-video-center:hover{background:#000d}
.community-video-center svg{width:26px;height:26px}
.community-video-controls{position:absolute;top:auto;right:0;bottom:0;left:0;z-index:5;box-sizing:border-box;display:grid;grid-template-rows:18px 24px;align-content:space-between;gap:0;height:110px;padding:30px 16px 24px;color:#fff;background:linear-gradient(180deg,transparent 0%,#0002 24%,#000b 100%);opacity:0;pointer-events:none;transition:opacity .2s ease}
.community-video-controls button,.community-video-controls input,.community-video-controls select,.community-video-settings{pointer-events:auto}
.community-video-player:hover .community-video-controls,.community-video-player:focus-within .community-video-controls,.community-video-player[data-playing="false"] .community-video-controls{opacity:1}
.community-video-timeline{display:flex;align-items:center;gap:10px;height:18px;color:#f8fafc;font-size:12px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000b}
.community-video-progress-wrap{flex:1;min-width:0}
.community-video-player .community-video-progress{display:block;width:100%;height:18px;margin:0;appearance:none;background:linear-gradient(to right,#ff5938 0%,#ff5938 var(--community-progress,0%),#ffffff80 var(--community-progress,0%),#ffffff80 100%) center/100% 2px no-repeat;accent-color:#ff5738;cursor:pointer;transition:background-size .16s ease,filter .16s ease}
.community-video-player .community-video-progress::-webkit-slider-runnable-track{height:2px;border-radius:999px;background:transparent}
.community-video-player .community-video-progress::-webkit-slider-thumb{width:8px;height:8px;margin-top:-3px;appearance:none;border:2px solid #fff;border-radius:50%;background:#ff5938;box-shadow:0 1px 4px #0009;transition:width .16s ease,height .16s ease,box-shadow .16s ease}
.community-video-player .community-video-progress::-moz-range-track{height:2px;border:0;border-radius:999px;background:transparent}
.community-video-player .community-video-progress::-moz-range-progress{height:2px;border-radius:999px;background:transparent}
.community-video-player .community-video-progress::-moz-range-thumb{width:8px;height:8px;box-sizing:border-box;border:2px solid #fff;border-radius:50%;background:#ff5938;box-shadow:0 1px 4px #0009;transition:width .16s ease,height .16s ease,box-shadow .16s ease}
.community-video-player .community-video-progress:hover{background-size:100% 4px;filter:drop-shadow(0 0 2px #ff593866)}
.community-video-player .community-video-progress:hover::-webkit-slider-runnable-track{height:4px}
.community-video-player .community-video-progress:hover::-webkit-slider-thumb{width:10px;height:10px;margin-top:-3px;box-shadow:0 0 0 3px #ff593833,0 1px 4px #0009}
.community-video-player .community-video-progress:hover::-moz-range-track,.community-video-player .community-video-progress:hover::-moz-range-progress{height:4px}
.community-video-player .community-video-progress:hover::-moz-range-thumb{width:10px;height:10px;box-shadow:0 0 0 3px #ff593833,0 1px 4px #0009}
.community-video-player .community-video-progress:focus-visible{outline:2px solid #ffffffa6;outline-offset:3px;border-radius:999px}
.community-video-toolbar{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:0;width:100%;height:24px}
.community-video-toolbar-left,.community-video-toolbar-right{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:20px}
.community-video-toolbar-right{margin-left:auto}
.community-video-toolbar button{position:relative;display:grid;width:24px;height:24px;min-width:24px;place-items:center;padding:0;border:0;border-radius:0;background:transparent;color:#fff;box-shadow:none;cursor:pointer;opacity:.94;transition:opacity .18s ease}
.community-video-toolbar button:hover,.community-video-toolbar button:focus-visible{background:transparent;color:#fff;opacity:1}
.community-video-toolbar button:disabled,.community-video-toolbar button:disabled:hover{background:transparent;color:#fff;cursor:not-allowed;opacity:.94}
.community-video-toolbar button:active{transform:none}
.community-video-toolbar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.community-video-toolbar button svg{width:24px;height:24px;stroke-width:1.5}
.community-video-toolbar button[data-community-video-back] svg,.community-video-toolbar button[data-community-video-forward] svg{width:24px;height:24px}
.community-video-toolbar-left>button[data-community-video-play]{width:24px;height:24px;min-width:24px}
.community-video-toolbar-right button{width:24px;height:24px;min-width:24px}
.community-video-toolbar-right button.is-active{color:#fff;opacity:1}
.community-video-seek-icon{position:relative;display:grid;place-items:center}
.community-video-seek-icon svg{width:24px;height:24px}
.community-video-seek-icon small{position:absolute;top:50%;left:50%;color:#fff;font-size:8px;font-weight:800;line-height:1;text-shadow:0 1px 2px #000;transform:translate(-50%,-42%)}
.community-video-toolbar button[data-tooltip]::after{position:absolute;bottom:calc(100% + 8px);left:50%;z-index:20;padding:6px 8px;border:1px solid #ffffff1a;border-radius:5px;background:#151a22;color:#fff;content:attr(data-tooltip);font:600 11px/1.2 Inter,system-ui,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transform:translate(-50%,4px);transition:opacity .14s ease,transform .14s ease}
.community-video-toolbar-right button[data-tooltip]::after{right:0;left:auto;transform:translateY(4px)}
.community-video-toolbar-left>button:first-child[data-tooltip]::after{right:auto;left:0;transform:translateY(4px)}
.community-video-volume-control{display:flex;flex-direction:row;align-items:center;gap:0}
.community-video-volume{width:0;height:4px;min-width:0;margin:0;opacity:0;pointer-events:none;accent-color:#ff5738;cursor:pointer;transition:width .16s ease,opacity .16s ease}
.community-video-volume-control:hover,.community-video-volume-control:focus-within{gap:7px}
.community-video-volume-control:hover .community-video-volume,.community-video-volume-control:focus-within .community-video-volume{width:72px;opacity:1;pointer-events:auto}
.community-video-volume-value{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.community-video-settings{position:absolute;right:14px;bottom:calc(100% + 8px);z-index:6;display:grid;gap:10px;min-width:210px;padding:14px;border:1px solid #ffffff24;border-radius:8px;background:#151a22;color:#f5f7fb;box-shadow:0 8px 26px #0008;font-size:13px}
.community-video-settings[hidden]{display:none}
.community-video-settings label{display:grid;gap:6px;color:#c9ced8}
.community-video-settings select{min-height:34px;padding:6px 8px;border:1px solid #ffffff2e;border-radius:5px;background:#090c12;color:#fff}
@media(hover:hover) and (pointer:fine){.community-video-toolbar button[data-tooltip]:hover::after,.community-video-toolbar button[data-tooltip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}.community-video-toolbar-right button[data-tooltip]:hover::after,.community-video-toolbar-right button[data-tooltip]:focus-visible::after,.community-video-toolbar-left>button:first-child[data-tooltip]:hover::after,.community-video-toolbar-left>button:first-child[data-tooltip]:focus-visible::after{transform:translateY(0)}}
@media(max-width:520px){.community-video-controls{height:96px;padding:27px 12px 20px;grid-template-rows:16px 22px}.community-video-toolbar{height:22px}.community-video-toolbar-left,.community-video-toolbar-right{gap:8px}.community-video-toolbar button,.community-video-toolbar-left>button[data-community-video-play],.community-video-toolbar-right button{width:22px;height:22px;min-width:22px}.community-video-toolbar button svg{width:20px;height:20px}.community-video-seek-icon svg{width:20px;height:20px}.community-video-settings{right:8px}}
@media(hover:none){.community-video-controls{opacity:1}.community-video-volume-control:focus-within{gap:6px}.community-video-volume-control:focus-within .community-video-volume{width:46px;opacity:1;pointer-events:auto}}
@media(max-width:360px){.community-video-toolbar-left,.community-video-toolbar-right{gap:6px}.community-video-toolbar button,.community-video-toolbar-left>button[data-community-video-play],.community-video-toolbar-right button{width:20px;height:20px;min-width:20px}.community-video-toolbar button svg,.community-video-seek-icon svg{width:18px;height:18px}.community-video-volume-control:focus-within .community-video-volume{width:30px}}
@media(min-width:801px){.layout:has(.community-video-player){max-width:1340px}main:has(.community-video-player){max-width:720px}}
.stats{display:flex;justify-content:space-between;padding:8px 14px;color:var(--muted);font-size:13px}
.pa{display:flex;border-top:1px solid var(--line);margin:0 8px;padding:4px 0}
.pa button{flex:1;background:none;border:0;padding:8px;border-radius:8px;color:var(--muted);font-weight:600}
.pa button:hover{background:var(--s2)}.pa button.on{color:var(--accent)}
.cms{padding:6px 14px 12px}.cms[hidden]{display:none}
.cm{display:flex;gap:8px;margin-top:8px}.cm .av{width:30px;height:30px;font-size:12px}
.cm div{background:var(--s2);border-radius:14px;padding:6px 12px;font-size:14px}
.cf{display:flex;gap:8px;margin-top:10px}
.reels{display:flex;flex-direction:column;align-items:center;gap:16px}
.reel{position:relative;width:min(100%,340px);aspect-ratio:9/16;max-height:78vh;border-radius:16px;overflow:hidden;color:#fff;scroll-snap-align:center}
.reel .vid{position:absolute;inset:0;aspect-ratio:auto}
.reel .cap{position:absolute;left:14px;right:70px;bottom:14px;text-shadow:0 1px 6px #000a;pointer-events:none}
.reel .side{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
.reel .side button{background:#0007;border:0;color:#fff;width:46px;height:46px;border-radius:50%;font-size:18px}
.reel .side button.on{color:#ff5c8a}.reel .side small{display:block;text-align:center;font-size:11px;margin-top:-10px}
aside .card{padding:14px;margin-bottom:14px}aside h3{font-size:16px;margin-bottom:8px}
.lb{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}.lb .av{width:30px;height:30px;font-size:12px}.lb em{margin-left:auto;font-style:normal;color:var(--muted)}
.ov{position:fixed;inset:0;background:#000d;z-index:50;display:none;place-items:center;padding:14px}.ov.on{display:grid}
.modal{background:var(--surface);border-radius:16px;width:min(440px,100%);padding:18px;max-height:92vh;overflow:auto}
.modal h2{font-size:20px;margin-bottom:12px}.modal .f{margin-bottom:10px}
.sw{display:flex;gap:8px}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:var(--text)}
.sv{width:min(380px,100%);height:min(86vh,680px);border-radius:16px;overflow:hidden;position:relative;color:#fff;background:#111}
.sv .pg{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
.sv .pg i{flex:1;height:3px;background:#fff5;border-radius:2px;overflow:hidden}.sv .pg i b{display:block;height:100%;width:0;background:#fff}
.sv .pg i.d b{width:100%}.sv .pg i.c b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
@media(prefers-reduced-motion:reduce){.sv .pg i.c b{animation-duration:.01s}}
.sv .who{position:absolute;top:20px;left:12px;display:flex;gap:8px;align-items:center;z-index:3;text-shadow:0 1px 4px #000a}
.sv .x{position:absolute;top:18px;right:12px;z-index:4;background:none;border:0;color:#fff;font-size:26px}
.sv .body{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font:800 26px 'Bricolage Grotesque',sans-serif;background-size:cover;background-position:center}
.sv .body .vid{position:absolute;inset:0;aspect-ratio:auto}
.sv .cap{position:absolute;left:16px;right:16px;bottom:18px;z-index:3;text-shadow:0 1px 6px #000a}
.sv .zl,.sv .zr{position:absolute;top:60px;bottom:60px;width:35%;z-index:2;background:none;border:0}.sv .zl{left:0}.sv .zr{right:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
.vid{cursor:pointer}.vid .op{color:#fff;text-decoration:none}.vid .op.top{bottom:auto;top:10px;right:10px;z-index:2}
.vf{width:100%;display:block;max-height:560px;background:#000}.reel .vf{position:absolute;inset:0;height:100%;object-fit:cover;max-height:none}
[data-u]{cursor:pointer}.ph[data-u] b:hover,.cm b[data-u]:hover{text-decoration:underline}
.prof{overflow:hidden;margin-bottom:14px}.cover{height:130px}
.pinfo{display:flex;gap:14px;align-items:flex-end;padding:0 16px 10px;flex-wrap:wrap}.pinfo .pn{flex:1;min-width:160px;padding-top:6px}.pn h2{font-size:24px}.pn small{color:var(--muted)}
.av.big{width:88px;height:88px;font-size:34px;border:4px solid var(--surface);margin-top:-44px}
.pst{display:flex;gap:18px;padding:10px 16px 14px;color:var(--muted);font-size:14px;flex-wrap:wrap;border-top:1px solid var(--line)}.pst b{color:var(--text)}
.ptabs{display:flex;gap:6px;margin-bottom:12px}.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rg .reel{width:100%;max-height:none}
.prof.profile-card{overflow:hidden;border-radius:18px;margin-bottom:16px;box-shadow:0 5px 22px #00000012}
.profile-cover{height:clamp(170px,30vw,260px);position:relative;overflow:hidden;background:linear-gradient(135deg,#145da0,#4f46e5 58%,#9333ea)}
.profile-cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-cover:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,#0005);pointer-events:none}
.profile-cover-action,.profile-avatar-action{position:absolute;z-index:2;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:9px;background:#111b;color:#fff;font-size:12px;font-weight:700;padding:8px 11px;backdrop-filter:blur(8px);transition:background .16s,transform .16s}
.profile-cover-action svg,.profile-avatar-action svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile-cover-action{right:14px;bottom:14px}.profile-cover-action:hover,.profile-avatar-action:hover{background:#111e;transform:translateY(-1px)}
.profile-identity{position:relative;display:grid;grid-template-columns:144px minmax(0,1fr) auto;align-items:end;gap:18px;padding:0 24px 18px;margin-top:-62px}
.profile-avatar-wrap{position:relative;width:144px;height:144px;z-index:2}
.profile-avatar,.profile-avatar-fallback{display:grid;width:100%;height:100%;place-items:center;object-fit:cover;border:6px solid var(--surface);border-radius:50%;background:var(--s2);box-shadow:0 2px 8px #0003}
.profile-avatar-fallback{font-size:48px;font-weight:700}
.profile-avatar-action{right:8px;bottom:8px;width:34px;height:34px;padding:0;border:2px solid var(--surface);border-radius:50%;font-size:15px}
.profile-main{min-width:0;padding:0 0 8px}
.profile-name{font-size:27px;line-height:1.15;overflow-wrap:anywhere}
.profile-bio{display:block;margin-top:6px;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.profile-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:12px}

/* ===== CWM Messenger (messenger.css) ===== */
/* CWM Messenger styles. Prefix: cwm-. Uses the host page's CSS variables (--bg --surface --s2 --line --text --muted --accent --btn --hov). */
#cwmRoot,#cwmRoot *{box-sizing:border-box}
#cwmRoot{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px)}
#cwmRoot.on{display:flex}
#cwmRoot button{cursor:pointer}
#cwmRoot h2,#cwmRoot h3,#cwmRoot h4{margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif}
.cwm-top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cwm-top h2{flex:1;font-size:18px}
.cwm-chip{font-size:11px;font-weight:700;color:var(--muted);background:var(--s2);padding:3px 9px;border-radius:999px}
.cwm-ibtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--s2);color:var(--text);display:grid;place-items:center;flex:none;padding:0}
.cwm-ibtn:hover{background:var(--hov)}
.cwm-ibtn svg{width:19px;height:19px}
.cwm-app{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.cwm-side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.cwm-sh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.cwm-sh h3{flex:1;font-size:22px}
.cwm-search{margin:6px 14px}
.cwm-search input,.cwm-in{width:100%;background:var(--s2);color:var(--text);border:0;border-radius:999px;padding:9px 14px;outline:0;font:inherit}
.cwm-search input:focus,.cwm-in:focus{box-shadow:0 0 0 2px var(--accent)}
.cwm-tabs{display:flex;gap:6px;padding:6px 14px 8px}
.cwm-tabs button{background:none;border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.cwm-tabs button:hover{background:var(--s2)}
.cwm-tabs button.on{background:rgba(45,136,255,.18);color:var(--accent)}
.cwm-list{flex:1;overflow-y:auto;padding:0 8px 10px}
.cwm-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px;color:var(--text)}
.cwm-row:hover,.cwm-row.on{background:var(--s2)}
.cwm-avw{position:relative;flex:none;display:inline-flex}
.cwm-av{display:grid;place-items:center;border-radius:50%;font-family:sans-serif;font-weight:700;color:#04202e;flex:none}
.cwm-av.g{color:#fff}
.cwm-dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#31a24c;border:2px solid var(--surface)}
.cwm-rt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.cwm-rt b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwm-rt small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwm-rt small.ty,.cwm-ch small.ty{color:var(--accent)}
.cwm-row.un .cwm-rt b,.cwm-row.un .cwm-rt small{font-weight:700;color:var(--text)}
.cwm-rm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:12px;color:var(--muted)}
.cwm-bd{min-width:20px;height:20px;border-radius:10px;background:var(--btn);color:#fff;font-size:12px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 6px}
.cwm-empty{text-align:center;color:var(--muted);padding:30px 16px}
.cwm-main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:var(--bg);overflow:hidden}
.cwm-ph{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.cwm-ph svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}
.cwm-ph h3{color:var(--text);font-size:20px;margin-bottom:6px}
.cwm-ph p{margin:0;max-width:340px;font-size:14px}
.cwm-chat{display:none;flex:1;min-height:0;flex-direction:column}
.cwm-chat.on{display:flex}
.cwm-ch{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cwm-ch .t{flex:1;min-width:0;line-height:1.25}
.cwm-ch .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwm-ch .t small{color:var(--muted);font-size:12px}
.cwm-back{display:none}
.cwm-msgs{flex:1;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column}
.cwm-day{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin:12px 0 6px}
.cwm-sys{text-align:center;color:var(--muted);font-size:12px;margin:8px 0}
.cwm-m{display:flex;gap:8px;align-items:flex-end;margin-top:2px}
.cwm-m.first{margin-top:10px}
.cwm-m.me{justify-content:flex-end}
.cwm-mav{width:28px;flex:none;display:block}
.cwm-bw{max-width:min(74%,480px);display:flex;flex-direction:column;min-width:0}
.cwm-m.me .cwm-bw{align-items:flex-end}
.cwm-sn{font-size:12px;color:var(--muted);margin:0 0 2px 12px}
.cwm-b{padding:8px 12px;border-radius:18px;background:var(--surface);box-shadow:0 1px 1px rgba(0,0,0,.15);word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.35;margin-top:2px}
.cwm-m.me .cwm-b{background:var(--btn);color:#fff}
.cwm-m.th .cwm-b{border-top-left-radius:6px;border-bottom-left-radius:6px}
.cwm-m.me .cwm-b{border-top-right-radius:6px;border-bottom-right-radius:6px}
.cwm-m.th.first .cwm-b:first-of-type{border-top-left-radius:18px}
.cwm-m.th.last .cwm-b:last-of-type{border-bottom-left-radius:18px}
.cwm-m.me.first .cwm-b:first-of-type{border-top-right-radius:18px}
.cwm-m.me.last .cwm-b:last-of-type{border-bottom-right-radius:18px}
.cwm-b.img{padding:0;background:none;box-shadow:none;overflow:hidden;border-radius:16px}
.cwm-b.img img{display:block;max-width:100%;max-height:300px;border-radius:16px}
.cwm-meta{font-size:11px;color:var(--muted);margin:3px 6px 0}
.cwm-dots{display:flex;gap:4px;padding:12px 14px}
.cwm-dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:cwmb 1.1s infinite ease-in-out}
.cwm-dots i:nth-child(2){animation-delay:.15s}.cwm-dots i:nth-child(3){animation-delay:.3s}
@keyframes cwmb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.cwm-pend{padding:8px 12px 0;background:var(--surface)}
.cwm-th{position:relative;display:inline-block}
.cwm-th img{height:64px;border-radius:10px;display:block}
.cwm-th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:14px;line-height:1;padding:0}
.cwm-comp{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface)}
.cwm-ta{flex:1;min-width:0;background:var(--s2);color:var(--text);border:0;border-radius:20px;padding:10px 14px;resize:none;height:40px;max-height:120px;outline:0;line-height:1.35;font:inherit}
.cwm-ta:focus{box-shadow:0 0 0 2px var(--accent)}
.cwm-send{width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.cwm-send svg{width:19px;height:19px}
.cwm-info{position:absolute;top:0;right:0;bottom:0;width:min(320px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:5;overflow-y:auto;padding:14px}
.cwm-info.on{transform:none;visibility:visible;transition:transform .25s}
.cwm-xi{float:right}
.cwm-ic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 14px;text-align:center;clear:both}
.cwm-ic small{color:var(--muted)}
.cwm-info h4{font-size:14px;color:var(--muted);margin:10px 0 6px}
.cwm-mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.cwm-mem span{flex:1}
.cwm-mem em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--s2);padding:2px 8px;border-radius:999px}
.cwm-act{display:flex;align-items:center;gap:10px;width:100%;background:var(--s2);border:0;border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600;color:var(--text);font-size:14px}
.cwm-act:hover{background:var(--hov)}
.cwm-act svg{width:18px;height:18px}
.cwm-act.dng{color:#f3425f}
.cwm-ov{position:absolute;inset:0;background:#000b;z-index:10;display:none;place-items:center;padding:14px}
.cwm-ov.on{display:grid}
.cwm-md{background:var(--surface);border-radius:12px;width:min(420px,100%);max-height:88%;display:flex;flex-direction:column;gap:10px;padding:14px}
.cwm-mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cwm-seg{display:flex;gap:4px;background:var(--s2);border-radius:999px;padding:3px}

.cwm-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.cwm-in{border-radius:10px}
.cwm-hint{margin:-4px 2px 0;font-size:12px;color:var(--muted)}
.cwm-ml{overflow-y:auto;min-height:120px;flex:1}
.cwm-u{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 8px;color:var(--text);font-weight:600}
.cwm-u:hover{background:var(--s2)}
.cwm-u>span:nth-child(2){flex:1}
.cwm-ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}

.cwm-ck svg{width:14px;height:14px;stroke-width:3}
.cwm-primary{border:0;border-radius:10px;background:var(--btn);color:#fff;font-weight:700;padding:11px}
.cwm-primary:disabled{opacity:.45;cursor:not-allowed}
.cwm-navbtn{position:relative;display:inline-grid;place-items:center;padding:8px 12px}
.cwm-navbtn svg{width:18px;height:18px;display:block}
.cwm-nb{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#f3425f;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.cwm-st.sent{color:var(--muted)}

.cwm-tk{float:right;display:inline-flex;align-items:center;gap:3px;margin:8px 0 -4px 10px;font-size:11px;line-height:1;color:rgba(255,255,255,.75);white-space:nowrap}

.cwm-tk .cwm-st svg{width:16px;height:16px}

.cwm-msgs{padding-top:40px}
.cwm-bw{position:relative}
.cwm-meta{display:block}
.cwm-b{position:relative;z-index:1}
.cwm-b.del{background:none!important;color:var(--muted)!important;font-style:italic;box-shadow:none;border:1px dashed var(--line)}

/* Create-post dialog follows the supplied compact social composer design. */
#modal:has(.cp-create-post){width:min(500px,100%);max-height:min(92vh,760px);padding:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 28px #0005}
.cp-create-post{color:var(--text)}
.cp-create-header{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:14px 56px;border-bottom:1px solid var(--line)}
.cp-create-header h2{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.cp-create-header .x2{right:12px;top:50%;width:36px;height:36px;display:grid;place-items:center;transform:translateY(-50%);background:var(--s2);color:var(--muted);font-size:18px}

.cp-create-body{padding:16px}

.cp-user-info{display:flex;min-width:0;flex-direction:column;align-items:flex-start}

.cp-create-post .aud:hover{background:var(--line)}

.cp-aud-chevron{font-size:11px;line-height:1}

.cp-editor .cpt{display:block;width:100%;min-height:150px;margin:0;padding:4px 2px 34px;border:0;outline:0;background:transparent;color:var(--text);font:400 18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;resize:vertical}

.cp-editor.is-colored .cpt.big::placeholder{color:#ffffffbf}
.cp-editor-tools{position:absolute;right:0;bottom:2px;left:0;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cp-editor-tools button{display:grid;width:30px;height:30px;place-items:center;padding:4px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.cp-editor-tools button:hover{background:var(--s2);color:var(--text)}
.cp-editor-tools .oi{width:22px;height:22px}
.cp-editor-tools #cpCount.warn{color:#e41e3f}
.cp-backgrounds{flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 14px}
.cp-backgrounds button{width:32px;height:32px;flex:none;padding:0;border:2px solid transparent;border-radius:8px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}

.cp-link-row{margin:0 0 14px;padding:10px;border-radius:12px;background:var(--s2)}

.cp-link-row .btn{flex:none}
.cp-create-post .cpmedia{margin:0 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--s2)}

.cp-create-post .addbar button:nth-child(2){color:#9b51e0}
.cp-create-post .addbar button:nth-child(3){color:#1877f2}
.cp-create-post .addbar button:nth-child(4){color:#f7b928}

.cp-upload-status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--text);font-size:13px;font-weight:600}

.cp-upload-track [role="progressbar"]{width:0;height:100%;border-radius:inherit;background:var(--accent);transition:width .15s ease}
@keyframes cp-upload-spin{to{transform:rotate(360deg)}}
.cp-upload-percent{color:var(--muted);font-variant-numeric:tabular-nums}
.cp-create-post .cp-submit{width:100%;min-height:40px;margin-top:16px;padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}

.cwm-emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line);max-height:188px;overflow-y:auto}
.cwm-emo[hidden]{display:none}
.cwm-emo button{border:0;background:none;font-size:24px;line-height:1;padding:6px 0;border-radius:8px}
.cwm-emo button:hover{background:var(--s2)}
.cwm-mem .cwm-av{flex:none}
.cwm-mem>span:nth-child(2){flex:1}
@media(max-width:800px){.cwm-self{top:4px;bottom:auto;width:76px;height:100px}}

/* ===== Composer v2 (cleaner) ===== */
.cwm-comp{background:var(--surface);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));gap:10px;border-top:1px solid var(--line);box-shadow:none}
.cwm-field{background:var(--s2);border-radius:26px;padding:2px 6px;min-height:44px;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
.cwm-field:focus-within{box-shadow:inset 0 0 0 1px var(--accent)}
.cwm-field .cwm-ta{padding:10px 6px;font-size:15px}
.cwm-fb{width:40px;height:40px}
.cwm-fb svg{width:21px;height:21px}
.cwm-send{width:44px;height:44px;background:var(--btn);color:#fff;box-shadow:none;transition:background .15s,color .15s,transform .1s}
.cwm-send.idle{opacity:1;background:var(--s2);color:var(--muted)}
.cwm-send.idle:hover{background:var(--hov)}
.cwm-send svg{width:20px;height:20px}
.cwm-emo{background:var(--surface);padding:10px 12px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.cwm-field,.cwm-send{transition:none}}

<script>/* ===== adapter.mock.js ===== */
/* Legacy in-memory adapter retained for local UI previews; the Community page
   mounts the live Firebase adapter from src/community-messenger.js instead.
   A compatible adapter exposes:
   mode, subscribe(cb), send(cid,{t,img,replyTo}), edit(cid,mid,text), remove(cid,mid,'all'|'me'),
   markRead(cid), setTyping(cid,bool),
   openDM(uid)->cid, createGroup(name,uids)->cid, addMembers(cid,uids), leave(cid)
   Snapshot passed to cb: { me:{id,name}, users:{id:{id,name,online,lastActive:ms}},
   convs:[{id,type:'dm'|'group',name,members:[id],admins:[id],unread,typing:[id],
           msgs:[{id,from,t,img,ts,seen,seenBy?:[id],replyTo?:mid,edited?,deleted?,hiddenFor?:[id]}]}] }  (from:'sys' = system line) */
(function(g){
'use strict';
var REPLIES=['Sounds good 👍','Haha nice!','Let me check and get back to you.','Can you send a screenshot?','Great idea, let’s do it.','Thanks for sharing!','I’ll join the study session tonight.','Which library did you use?'];
function MockAdapter(o){
  o=o||{};
  var now=Date.now(),MIN=6e4,H=36e5,n=100,subs=[];
  var users={me:{id:'me',name:o.name||'You',online:true,lastActive:now}};
  [['siam','Siam',1],['rafi','Rafi',1],['nusrat','Nusrat',0,25*MIN],['tanvir','Tanvir',1],['mim','Mim',0,3*H],['sabbir','Sabbir',1],['ayesha','Ayesha',0,26*H],['hasan','Hasan',0,75*H]].forEach(function(a){users[a[0]]={id:a[0],name:a[1],online:!!a[2],lastActive:now-(a[3]||0)}});
  function mid(){return 'm'+(n++)}
  function M(f,t,ago){return{id:mid(),from:f,t:t,img:null,ts:now-ago,seen:true}}
  var convs=[
    {id:'c1',type:'dm',members:['me','siam'],unread:2,typing:[],msgs:[M('me','Salam Siam bhai, the OpenCV tutorial was great!',26*H),M('siam','Thanks! Glad it helped 🙌',26*H-2*MIN),M('siam','Next one will be on PyTorch.',22*MIN),M('siam','Want to help test it?',21*MIN)]},
    {id:'c2',type:'dm',members:['me','rafi'],unread:0,typing:[],msgs:[M('rafi','My CNN hit 92% accuracy!',5*H),M('me','Congrats! Can you share the notebook?',5*H-3*MIN),M('rafi','Sure, sending it tonight.',4*H)]},
    {id:'g1',type:'group',name:'ML Study Group',members:['me','siam','rafi','nusrat','tanvir'],admins:['siam'],unread:3,typing:[],msgs:[M('siam','Reminder: study session at 9 PM.',3*H),M('me','Count me in!',150*MIN),M('nusrat','I’ll bring the Pandas notes.',2*H),M('rafi','Can we cover CNNs too?',50*MIN),M('tanvir','+1 for CNNs',40*MIN)]},
    {id:'g2',type:'group',name:'Python Beginners',members:['me','mim','sabbir','ayesha'],admins:['me'],unread:0,typing:[],msgs:[{id:mid(),from:'sys',t:'You created the group “Python Beginners”',ts:now-48*H},M('mim','Hi everyone!',47*H),M('sabbir','Welcome 👋',46*H),M('me','Post your questions here anytime.',46*H-MIN)]},
    {id:'c3',type:'dm',members:['me','nusrat'],unread:1,typing:[],msgs:[M('nusrat','Pandas tip: use .query() for readable filters.',2*H)]}
  ];
  (function(){var gm=convs[2].msgs;gm[1].replyTo=gm[0].id;gm[4].replyTo=gm[3].id;gm[2].edited=true;gm[0].rx={'👍':['rafi','nusrat'],'❤️':['tanvir']}})();
  function snap(){return{me:users.me,users:users,convs:convs}}
  function emit(){var s=snap();subs.slice().forEach(function(f){f(s)})}
  function get(id){for(var i=0;i<convs.length;i++)if(convs[i].id===id)return convs[i];return null}
  function findm(c,id){for(var i=0;i<c.msgs.length;i++)if(c.msgs[i].id===id)return c.msgs[i];return null}
  function lastMine(c){for(var i=c.msgs.length-1;i>=0;i--)if(c.msgs[i].from==='me'&&!c.msgs[i].deleted)return c.msgs[i].id;return null}
  function sys(c,t){c.msgs.push({id:mid(),from:'sys',t:t,img:null,ts:Date.now(),seen:true})}
  function reply(c){
    if(c._busy)return;
    var others=c.members.filter(function(x){return x!=='me'});
    if(!others.length)return;
    var r=others[Math.floor(Math.random()*others.length)];
    c._busy=true;
    setTimeout(function(){c.typing=[r];emit()},900);
    setTimeout(function(){
      c.typing=[];
      users[r].online=true;users[r].lastActive=Date.now();c.msgs.forEach(function(m){if(m.from==='me'&&!m.seen){m.seen=true;m.seenBy=[r]}});
      c.msgs.push({id:mid(),from:r,t:REPLIES[Math.floor(Math.random()*REPLIES.length)],img:null,replyTo:(Math.random()<.35?lastMine(c):null),ts:Date.now(),seen:true});
      c.unread=(c.unread||0)+1;c._busy=false;emit();
    },2900);
  }
  return{
    mode:'demo',
    subscribe:function(f){subs.push(f);f(snap());return function(){subs=subs.filter(function(x){return x!==f})}},
    send:function(cid,p){var c=get(cid);if(!c)return Promise.reject(new Error('Chat not found'));c.msgs.push({id:mid(),from:'me',t:(p.t||'').slice(0,2000),img:p.img||null,replyTo:p.replyTo||null,ts:Date.now(),seen:false});emit();reply(c);return Promise.resolve()},
    markRead:function(cid){var c=get(cid);if(c&&c.unread){c.unread=0;emit()}return Promise.resolve()},
    setTyping:function(){return Promise.resolve()},
    openDM:function(uid){
      var c=convs.filter(function(x){return x.type==='dm'&&x.members.indexOf(uid)>-1})[0];
      if(!c){c={id:'c'+(n++),type:'dm',members:['me',uid],unread:0,typing:[],msgs:[],created:Date.now()};convs.push(c);emit()}
      return Promise.resolve(c.id);
    },
    createGroup:function(name,ids){
      var c={id:'g'+(n++),type:'group',name:name,members:['me'].concat(ids),admins:['me'],unread:0,typing:[],msgs:[],created:Date.now()};
      sys(c,'You created the group “'+name+'”');convs.push(c);emit();return Promise.resolve(c.id);
    },
    addMembers:function(cid,ids){
      var c=get(cid);if(!c)return Promise.resolve();
      var add=ids.filter(function(x){return c.members.indexOf(x)<0});
      c.members=c.members.concat(add);
      if(add.length)sys(c,'You added '+add.map(function(x){return users[x].name}).join(', '));
      emit();return Promise.resolve();
    },
