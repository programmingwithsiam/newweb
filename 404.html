<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | CodeWithSiam</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="/assets/images/profile-siam.jpeg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .not-found-inner { display: grid; justify-items: center; gap: 14px; max-width: 520px; padding: 42px 28px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(21, 28, 25, .82); }
    .not-found-code { color: var(--accent); font: 700 4rem var(--font-display); }
    .not-found h1 { margin: 0; font-family: var(--font-display); }
    .not-found p { color: var(--text-dim); line-height: 1.6; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <span class="not-found-code">404</span>
      <h1>Page not found</h1>
      <p>This page moved, or the address is not available anymore.</p>
      <a class="btn btn-primary" href="/">Back to CodeWithSiam</a>
    </div>
  </main>
</body>
</html>
